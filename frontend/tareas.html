<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Palma - Mis Tareas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>

    <h1>📋 Proyecto Palma</h1>
    <p>Organizador de tareas</p>

</header>

<nav>

    <a href="index.html">Inicio</a>
    <a href="tareas.html">Mis tareas</a>

</nav>

<main>

<section class="panelPrincipal">

<h2>Mis tareas</h2>

<div class="agregar">

    <input
        type="text"
        id="nuevatarea"
        placeholder="Escribí una tarea">

    <input
        type="date"
        id="fechatarea">

    <button onclick="agregartarea()">
        Agregar
    </button>

</div>

</section>

<section class="contenedor">

<div class="calendario">

<h2>📅 Calendario</h2>

<input
type="date"
id="calendario">

<p class="textoCalendario">

Seleccioná una fecha para organizar tus actividades.

</p>

</div>

<div class="recordatorios">

<h2>🔔 Recordatorios</h2>

<ul id="recordatorios">

</ul>

</div>

</section>

<section class="lista">

<h2>Lista de tareas</h2>

<ul id="listatareas">

</ul>

</section>

</main>

<footer>

<p>

7° Año Programación

</p>

</footer>

<script src="js/tareas.js"></script>

</body>

</html>
